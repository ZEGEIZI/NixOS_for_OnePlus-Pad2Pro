# HDR content -> SDR screen tone mapping. This does not enable a native
# BT.2100/PQ output mode or change the panel's 8-bpc DSI/DSC transport.
[pad2pro-hdr]
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
# Preserve Main10 precision through the application's Wayland surface. The
# default EGL config can be RGB8 even when Mutter scans out XR30.
egl-output-format=rgb10_a2
hwdec=no
fbo-format=rgba16hf
target-trc=srgb
target-prim=bt.709
target-peak=100
target-colorspace-hint=no
tone-mapping=bt.2390
gamut-mapping-mode=perceptual
hdr-compute-peak=yes
dither-depth=auto
temporal-dither=yes

# Submit PQ content to the HDR compositor without reducing 12-bit sources to
# RGB10_A2 or gamma/PQ FP16. The compositor owns the panel's final quantization.
# Enable GNOME HDR before using this profile.
[pad2pro-native-hdr]
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
egl-output-format=rgba16
hwdec=no
fbo-format=rgba32f
target-trc=pq
target-prim=bt.2020
target-peak=10000
target-colorspace-hint=yes
tone-mapping=clip
gamut-mapping-mode=clip
hdr-compute-peak=no
dither-depth=no
